name: Hourly city pipelines and dashboard
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['agent-de/**', '.github/workflows/hourly-pipeline.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flowpilot-production
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: agent-de
    env:
      LLM_PROVIDER: builtin
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: agent-de-sandbox:local
      SCHEDULE_FREQUENCY: hourly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-de/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test pipeline contracts
        run: python -m pytest -q
      - name: Build isolated execution worker
        run: docker build -f Dockerfile.sandbox -t agent-de-sandbox:local .
      - name: Restore last published warehouse
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          url = 'https://abhisheksd27.github.io/Flowpilot/pipeline.duckdb'
          r = requests.get(url, timeout=60)
          if r.status_code == 404:
              print('No prior published warehouse; initializing first run')
          else:
              r.raise_for_status()
              if len(r.content) > 200_000_000:
                  raise RuntimeError('Warehouse exceeds free deployment checkpoint limit')
              Path('data').mkdir(exist_ok=True)
              Path('data/pipeline.duckdb').write_bytes(r.content)
              import duckdb
              with duckdb.connect('data/pipeline.duckdb', read_only=True) as con:
                  con.execute('SELECT count(*) FROM silver_environment').fetchone()
          PY
      - name: Fetch, validate, repair, publish and analyze
        id: run
        continue-on-error: true
        run: python -m pipeline.cities
      - name: Export public dashboard and warehouse checkpoint
        run: python -m pipeline.export_site ../site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record pipeline failure after publishing the honest status
        if: steps.run.outcome == 'failure'
        run: exit 1
